spring:
  application:
    name: studio-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:maamora_studio}?sslmode=${DB_SSL_MODE:disable}
    username: ${DB_USERNAME:maamora}
    password: ${DB_PASSWORD:maamora}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

  mail:
    host: ${SPRING_MAIL_HOST:${SMTP_HOST:}}
    port: ${SPRING_MAIL_PORT:${SMTP_PORT:587}}
    username: ${SPRING_MAIL_USERNAME:${SMTP_USERNAME:}}
    password: ${SPRING_MAIL_PASSWORD:${SMTP_PASSWORD:}}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:${SMTP_AUTH:true}}
          starttls:
            enable: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:${SMTP_STARTTLS:true}}

app:
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${ANTHROPIC_MODEL:claude-3-5-sonnet-20240620}
    base-url: https://api.anthropic.com/v1/messages
  
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    
  storage:
    local-path: ${STORAGE_LOCAL_PATH:./uploads}
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:http://localhost:8080/files}

  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:placeholder}
    api-key: ${CLOUDINARY_API_KEY:placeholder}
    api-secret: ${CLOUDINARY_API_SECRET:placeholder}

  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-1.5-pro}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}

  higgsfield:
    api-key-id: ${HIGGSFIELD_API_KEY_ID:}
    api-key-secret: ${HIGGSFIELD_API_KEY_SECRET:}
    model: ${HIGGSFIELD_MODEL:flux-pro/kontext/max/text-to-image}
    reference-model: ${HIGGSFIELD_REFERENCE_MODEL:flux-pro/kontext/max/image-to-image}
    video-model: ${HIGGSFIELD_VIDEO_MODEL:}
    base-url: ${HIGGSFIELD_BASE_URL:https://platform.higgsfield.ai}
    timeout-ms: ${HIGGSFIELD_TIMEOUT_MS:180000}
    poll-interval-ms: ${HIGGSFIELD_POLL_INTERVAL_MS:3000}

  ollama:
    enabled: ${OLLAMA_ENABLED:false}
    model: ${OLLAMA_MODEL:qwen2.5:7b}
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434/api}
    
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

  social:
    frontend-url: ${FRONTEND_URL:http://localhost:3000}
    meta:
      app-id: ${META_APP_ID:}
      app-secret: ${META_APP_SECRET:}
      redirect-uri: ${META_REDIRECT_URI:http://localhost:8080/api/social/callback/meta}
      graph-version: ${META_GRAPH_VERSION:v20.0}
    tiktok:
      client-key: ${TIKTOK_CLIENT_KEY:}
      client-secret: ${TIKTOK_CLIENT_SECRET:}
      redirect-uri: ${TIKTOK_REDIRECT_URI:http://localhost:8080/api/social/callback/tiktok}
    linkedin:
      client-id: ${LINKEDIN_CLIENT_ID:}
      client-secret: ${LINKEDIN_CLIENT_SECRET:}
      redirect-uri: ${LINKEDIN_REDIRECT_URI:http://localhost:8080/api/social/callback/linkedin}
    x:
      client-id: ${X_CLIENT_ID:}
      client-secret: ${X_CLIENT_SECRET:}
      redirect-uri: ${X_REDIRECT_URI:http://localhost:8080/api/social/callback/x}

  mail:
    from: ${APP_MAIL_FROM:${SMTP_FROM:}}

  admin:
    email: ${ADMIN_EMAIL:admin@maamora.com}
    password: ${ADMIN_PASSWORD:admin123}
